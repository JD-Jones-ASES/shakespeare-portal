name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and verify the deployment origin.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            scripts/package-lock.json

      - name: Build the client search index
        working-directory: scripts
        run: |
          npm ci
          npm run build:index

      # The admitgate seal: audit (ledger <-> item consistency, staleness,
      # the review queue) + the gates registered in gates.toml — the three
      # validators CI never ran before M2. Refused data cannot ship:
      # generate-then-gate, never generate-then-ship. The LLM panel never
      # runs here; the seal only verifies its committed records.
      - name: admitgate seal
        uses: JD-Jones-ASES/admitgate@cfff8eb390d4d8ac8366e066c3f3edfeacec4720 # M2 pre-1.0 SHA pin

      - name: Build the Astro site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
